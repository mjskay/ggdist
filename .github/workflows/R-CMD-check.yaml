# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
      - master
      - dev

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release',  vignettes: true}

          - {os: windows-latest, r: 'release',  vignettes: true}
          # Use 4.1 on Windows to check with rtools40's older compiler
          # Also note the vignettes don't work on R 4.1 due to use of the `_` pipe placeholder
          - {os: windows-latest, r: '4.1',      vignettes: false}

          - {os: ubuntu-latest,  r: 'devel',    vignettes: true, http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release',  vignettes: true }
          - {os: ubuntu-latest,  r: 'oldrel-1', vignettes: true }
          - {os: ubuntu-latest,  r: 'oldrel-2', vignettes: true }
          - {os: ubuntu-latest,  r: 'oldrel-3', vignettes: true }
          - {os: ubuntu-latest,  r: 'oldrel-4', vignettes: true }
          - {os: ubuntu-latest,  r: '4.1',      vignettes: false}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EXTRA_BUILD_ARGS: ${{ matrix.config.vignettes && 'NULL' || 'c("--no-build-vignettes")' }}
      EXTRA_CHECK_ARGS: ${{ matrix.config.vignettes && 'NULL' || 'c("--no-build-vignettes", "--no-vignettes", "--ignore-vignettes")' }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: ${{ matrix.config.r != 'devel' }}

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
        shell: Rscript {0}

      - name: Cache R packages
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ matrix.config.r }}-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-r-${{ matrix.config.r }}-1-

      - name: Install system dependencies
        if: runner.os == 'Linux'
        env:
          RHUB_PLATFORM: linux-x86_64-ubuntu-gcc
        run: |
          sudo apt-get install -y pngquant libcurl4-openssl-dev
          Rscript -e "install.packages('pak')"
          sysreqs=$(Rscript -e "cat(tryCatch(pak::pkg_sysreqs('.', dependencies = TRUE), error = function(e) pak::pkg_sysreqs('.'))[['install_scripts']])")
          sudo -s eval "$sysreqs"

      - name: Install dependencies
        run: |
          remotes::install_deps(dependencies = TRUE)
          remotes::install_cran("rcmdcheck")
        shell: Rscript {0}

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf", ${{ env.EXTRA_BUILD_ARGS }})'
          args: 'c("--no-manual", "--as-cran", ${{ env.EXTRA_CHECK_ARGS }})'
